; Export presets for Windows, Linux and macOS.
;
; NOTE: building from these requires Godot's export templates for 4.3-stable,
; which are a separate ~800 MB download (Editor → Manage Export Templates →
; Download and Install). These presets have not been built against templates
; in this repository, so treat the first export on each platform as unverified.
;
; Once templates are installed:
;   godot --headless --export-release "Windows Desktop" build/windows/KioskAtMidnight.exe
;   godot --headless --export-release "Linux"           build/linux/KioskAtMidnight.x86_64
;   godot --headless --export-release "macOS"           build/macos/KioskAtMidnight.zip

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/windows/KioskAtMidnight.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
